name: Tests
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: pnpm setup
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install packages
        run: pnpm install --frozen-lockfile
      - name: Install Playwright's Chromium
        # For the editor's specs that run in a real browser
        run: pnpm --filter vuemail-editor exec playwright install chromium --with-deps
      - name: Run Build
        run: pnpm build
      - name: Run Tests
        run: pnpm test
